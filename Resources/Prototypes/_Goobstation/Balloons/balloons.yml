# This hopefully won't kill server performance

- type: entity
  name: dragon zepplin
  parent: BaseBalloon
  description: Tier 1 Moab Class Balloon. Summons four carp balloons on death.
  id: MoabBalloon
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/moabs.rsi # Had to change RSI due to different pixel dimensions
    state: dragon
    noRot: false
  - type: Balloon
    minCash: 5
    maxCash: 10
    speed: 1.2
    spawnOnPop:
    - CeramicBalloon
    - CeramicBalloon
    - CeramicBalloon
    - CeramicBalloon
  - type: Transform
  - type: Rotatable
  - type: Destructible
    thresholds:
    - trigger:
       !type:DamageTrigger
       damage: 50     # balloon health, Nerfed asf
      behaviors:
      - !type:PlaySoundBehavior
       sound:
         path: /Audio/_Goobstation/BalloonEffect/balloon_pop.ogg
         params:
           variation: 0.125
           volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

