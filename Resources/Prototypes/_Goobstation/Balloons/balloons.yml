# This hopefully won't kill server performance

- type: entity
  name: dragon zepplin
  parent: BaseBalloon
  description: Tier 1 Moab Class Balloon. Summons four carp balloons on death.
  id: MoabBalloon
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/moabs.rsi
    noRot: false
    layers:
    - state: dragon
      map: [ "base" ]
    - state: regrow
      map: [ "regrow" ]
      visible: false
    - state: camo
      map: [ "camo" ]
      visible: false
  - type: Balloon
    speed: 1
    popHealth: 800
    currentPopHealth: 800
    isMoab: true
    lives: 616 # Game accurate
    spawnOnPop:
    - CeramicBalloon
    - CeramicBalloon
    - CeramicBalloon
    - CeramicBalloon
  - type: Transform
  - type: Rotatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/BalloonEffect/balloon_pop.ogg
          params:
            variation: 0.125
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

