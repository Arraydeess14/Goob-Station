- type: entity
  name: base balloon
  parent: BaseStructureDynamic
  id: BaseBalloon       # Base balloon
  abstract: true # Make sure it doesn't appear
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/balloons.rsi
    drawdepth: Overdoors # just so it renders above spesos
    noRot: True
    layers:
    - state: icon
      map: [ "base" ]
    - state: camo
      visible: false
      map: [ "camo" ]
    - state: regrow
      visible: false
      map: [ "regrow" ]
  - type: Damageable
    damageContainer: RubberBalloon # default damage container
  - type: Physics # has dynamic physics
    bodyType: Dynamic
  - type: Penetratable # projectile Able to pierce balloons
    penetrateDamage: 0
    damagePenalty: 0
  - type: NpcFactionMember
    factions:
      - Balloon
  - type: InteractionOutline
  - type: Fixtures # give it locker collision
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
          - TabletopMachineMask
        layer:
          - TabletopMachineLayer    # No collision but still able to be shot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4           # balloon health
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/BalloonEffect/balloon_pop.ogg
          params:
            variation: 0.125
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
          
# Validator Bloon
- type: entity
  name: validtator balloon
  parent: BaseBalloon
  description: Validator balloon, purely for validating track.
  id: ValidatorBalloon
  components:
  - type: Sprite
    state: icon
  - type: Balloon
    speed: 10.0
    lives: 0
    isValidator: true
    spawnOnPop: []
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800         # balloon health
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/BalloonEffect/balloon_pop.ogg
          params:
            variation: 0.125
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
        
